name: Astro build (trial)
on:
  workflow_dispatch:
  push:
    branches: [astro]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 scripts/export_data.py
      - run: npm install
        working-directory: astro
      - run: npm run build
        working-directory: astro
      - run: ls astro/dist/duo-apps | wc -l; ls astro/dist/news | wc -l; du -sh astro/dist
      - uses: actions/upload-artifact@v4
        with: { name: astro-dist, path: astro/dist }
