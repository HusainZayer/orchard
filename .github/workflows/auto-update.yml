name: Automatic update

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the App Store and Apple's release feed
        id: run
        run: python scripts/auto_update.py
      - name: Rebuild the public page
        if: steps.run.outputs.changed == 'true'
        run: python scripts/build.py
      - uses: actions/setup-node@v4
        if: steps.run.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Rebuild the static pages
        if: steps.run.outputs.changed == 'true'
        run: bash scripts/gen_pages.sh
      - name: Commit and push (Vercel deploys automatically)
        if: steps.run.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.run.outputs.summary }}
          DETAILS: ${{ steps.run.outputs.details }}
        run: |
          git config user.name "orchard-bot"
          git config user.email "orchard-bot@users.noreply.github.com"
          git add src/orchard.html app.html index.html vercel.json duo-apps news duo-apps.html news.html sitemap.xml feed.xml robots.txt
          git commit -m "Automatic update: $SUMMARY" -m "$DETAILS"
          git pull --rebase origin main
          git push origin HEAD:main
