name: Build static pages (Astro)
on:
  push:
    branches: [main, astro]
    paths: [src/orchard.html, scripts/build.py, astro/**, scripts/gen_pages.sh, scripts/export_data.py, .github/workflows/pages.yml]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 scripts/build.py
      - run: bash scripts/gen_pages.sh
      - name: Commit the pages if they changed (main only; Vercel deploys automatically)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "orchard-bot"
          git config user.email "orchard-bot@users.noreply.github.com"
          git add app.html vercel.json index.html duo-apps news picks devices calendar week og duo-apps.html news.html picks.html devices.html calendar.html week.html sitemap.xml feed.xml robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild static pages"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with: { name: pages, path: "app.html\nvercel.json\nindex.html\nduo-apps\nnews\npicks\npicks.html\ndevices\ndevices.html\ncalendar\ncalendar.html\nweek\nweek.html\nduo-apps.html\nnews.html\nsitemap.xml\nfeed.xml\nrobots.txt" }
